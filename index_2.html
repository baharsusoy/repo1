<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <title>Bahar'ın Sayfası</title>
        <style>
            body {
                background-color: rgb(219, 195, 173)  ;
                font-family: 'Segoe UI', sans-serif;
                color: rgb(144, 107, 52);
                padding: 20px;
            }

            h1,h2 {
                color: rgb(71, 95, 39) ;
                text-align: center;
            }

            p {
                color: rgb(144, 107, 52);
                text-align: center;
            }

            ul, table, form {
                margin: 20px auto;
                max-width: 600px;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            form {
                background-color: #292b58;
                padding: 20px;
                border-radius: 10px;
            }

            input, textarea {
                width: 100%;
                padding: 8px;
                margin-top: 5px;
                margin-bottom: 15px;
                border: 1px solid #553106;
                border-radius: 5px;
            }

            button {
                background-color: #06c;
                color: white;
                padding: 10px 20px;
                font-size: 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            }

            button:hover {
                background-color: #004d99;
                transform: scale(1.05);
                box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
            }
        </style>
    </head>
    <body>
        <h1>Merhaba Ben Bahar</h1>
        <p>Bu benim ilk el yazısı web sayfam</p>

        <h2>Favori Aktivitelerim</h2>
        <ul>
            <li>Müzik dinlemek</li>
            <li>Anime izlemek</li>
            <li>Kod yazmak</li>
        </ul>

        <h2>Haftalık Planım</h2>
        <table border="1">
            <tr>
                <th>Gün</th>
                <th>Etkinlik</th>
            </tr>
            <tr>
                <td>Pazartesi</td>
                <td>HTML çalış</td>
            </tr>
            <tr>
                <td>Salı</td>
                <td>CSS öğren</td>
            </tr>
            <tr>
                <td>Çarşamba</td>
                <td>İlk kişisel web siteni yaz</td>
            </tr>
            <tr>
                <td>Perşembe</td>
                <td>Kişisel web siteni CSS ile stilize et</td>
            </tr>
        </table>

        <h2>Bana Ulaş</h2>
        <form>
            <label for="isim">Adınız:</label><br>
            <input type="text" id="isim" name="isim"><br><br>
            <label for="mesaj">Mesajınız:</label><br>
            <textarea name="mesaj" id="mesaj" rows="4" cols="30"></textarea><br><br>
            <button type="submit">Gönder</button>
        </form>
    </body>
</html>
